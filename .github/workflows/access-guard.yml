name: access-guard

# OWNER-ONLY POLICY MONITOR — the detector for the two failures that matter most.
#
# WHY IT EXISTS
# The intended policy is: this repository stays private and owner-only, and no copy
# of it exists anywhere else. On the current plan that policy cannot be ENFORCED by
# GitHub for this repository, and the limits are measured rather than assumed
# (2026-10-09, roadmap §27AF, checklist §42):
#   * branch protection  -> 403 "Upgrade to GitHub Pro or make this repository public"
#   * repository rulesets -> same 403
#   * secret scanning and push protection -> public-repository-only features, so
#     `security_and_analysis` is null; `scripts/check-secrets.mjs` replaces them
#   * `allow_forking` -> 422 "Allow forks setting can only be changed on org-owned
#     private repositories", so forking cannot even be switched off
# So nothing platform-side stops the one change that would undo everything: the
# repository being flipped public, or a copy appearing as a fork. This workflow is
# the detector for exactly those two, running daily so a silent settings change
# shows up as a red run within a day instead of never.
#
# WHAT IT ASSERTS (hard, and all of it readable without admin rights)
#   * the repository is still private
#   * it has no forks and no network — nothing has been copied through GitHub
#   * the owner is the only collaborator
#
# The third one is measured rather than assumed: on its first real run (2026-10-09,
# run 37893715498) the collaborators endpoint answered **200** to GITHUB_TOKEN while
# every administration-level endpoint below answered 403, so owner-only membership
# is enforced unattended instead of merely reported.
#
# WHAT IT MERELY REPORTS, AND WHY THAT IS DELIBERATE
# Invitations, deploy keys, webhooks, Actions secrets, the Actions policy, branch
# protection and repository rulesets sit behind the `Administration` repository
# permission, which GITHUB_TOKEN cannot be granted (it is absent from the
# permissions the token can hold) — all seven were measured answering 403. The job
# prints each endpoint's HTTP status, and asserts emptiness whenever it does get a
# 200, so an unreadable endpoint is visible in the log rather than silently counted
# as a pass. Those need a credential that may read them, so the deep audit is a
# manual, owner-run check instead:
#
#   node scripts/audit-access.mjs        # uses the owner's `gh` session
#
# That script is the counterpart to this workflow and exits non-zero on a policy
# violation. Neither one is a substitute for the other: this one runs unattended
# and covers the surface GITHUB_TOKEN can see; that one covers the rest on demand.
#
# WHY SCHEDULED RATHER THAN ON PUSH
# The policy changes through repository settings, not through a commit, so a push
# trigger would miss the very thing being watched. Daily plus manual dispatch costs
# about ten seconds of Actions minutes per run.
#
# NOT A SUBSTITUTE FOR THE ACCOUNT ITSELF
# Every control here protects the repository. The account that holds it is the real
# perimeter: with 2FA unavailable to verify over the API, the owner-side checklist
# in docs/SOURCE_PROTECTION.md is what closes that gap.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-only:
    runs-on: ubuntu-latest
    steps:
      - name: Assert the repository is still private and unforked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          meta=$(gh api "repos/$GITHUB_REPOSITORY")
          private=$(printf '%s' "$meta" | jq -r '.private')
          visibility=$(printf '%s' "$meta" | jq -r '.visibility')
          forks=$(printf '%s' "$meta" | jq -r '.forks_count')
          network=$(printf '%s' "$meta" | jq -r '.network_count')

          echo "visibility=$visibility  private=$private  forks_count=$forks  network_count=$network"

          failed=0

          if [ "$private" != "true" ]; then
            echo "::error::Repository is NOT private (visibility=$visibility). The source is exposed."
            failed=1
          fi

          if [ "$forks" -ne 0 ]; then
            echo "::error::forks_count=$forks — a fork exists. Review who has access."
            failed=1
          fi

          if [ "$network" -ne 0 ]; then
            echo "::error::network_count=$network — the repository is part of a fork network."
            failed=1
          fi

          exit "$failed"

      - name: Probe the access surface (assert what is readable, report the rest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          repo="$GITHUB_REPOSITORY"
          owner="${GITHUB_REPOSITORY%%/*}"
          failed=0

          # One call, keeping the status line, so an unreadable endpoint is reported
          # as a status instead of being confused with an empty result.
          call() {
            gh api "repos/$repo/$1" -i 2>&1 || true
          }

          status_of() {
            call "$1" | tr -d '\r' | head -n 1 | awk '{print $2}'
          }

          body_of() {
            call "$1" | tr -d '\r' | sed -n '/^$/,$p' | tail -n +2
          }

          echo "--- endpoints this token cannot read report 403; that is a plan/permission"
          echo "--- limit, not a finding. They are checked by scripts/audit-access.mjs."

          for path in \
            "collaborators?affiliation=all&per_page=100" \
            "invitations?per_page=100" \
            "keys?per_page=100" \
            "hooks?per_page=100" \
            "actions/secrets?per_page=100" \
            "actions/permissions" \
            "branches/main/protection" \
            "rulesets"
          do
            echo "  HTTP $(status_of "$path")  $path"
          done

          # Collaborators: assert the owner is the only account, when readable.
          collab_path="collaborators?affiliation=all&per_page=100"
          collab_status=$(status_of "$collab_path")
          if [ "$collab_status" = "200" ]; then
            if ! others=$(body_of "$collab_path" | jq -r --arg owner "$owner" '[.[] | select(.login != $owner) | .login] | join(", ")'); then
              echo "::error::Could not parse the collaborator list."
              failed=1
            elif [ -n "$others" ]; then
              echo "::error::Collaborator(s) other than the owner: $others"
              failed=1
            else
              echo "  collaborators: owner-only (asserted)"
            fi
          else
            echo "  collaborators: NOT VERIFIED here (HTTP $collab_status) — run scripts/audit-access.mjs"
          fi

          # Deploy keys, webhooks and invitations: assert emptiness when readable.
          for path in "keys?per_page=100" "hooks?per_page=100" "invitations?per_page=100"; do
            code=$(status_of "$path")
            if [ "$code" = "200" ]; then
              count=$(body_of "$path" | jq 'length' 2>/dev/null || echo unparsed)
              if [ "$count" = "0" ]; then
                echo "  $path: empty (asserted)"
              else
                echo "::error::$path returned $count item(s) — each one is an access path into this repository."
                failed=1
              fi
            else
              echo "  $path: NOT VERIFIED here (HTTP $code)"
            fi
          done

          exit "$failed"
