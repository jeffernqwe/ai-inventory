name: main-guard

# The bypass detector: what reaches main without a pull request.
#
# WHY IT EXISTED
# It was written as the free-plan substitute for branch protection. GitHub's classic
# protection and the rulesets API were BOTH unavailable on a private repository without
# GitHub Pro, each answering:
#
#   "Upgrade to GitHub Pro or make this repository public to enable this feature." (HTTP 403)
#
# so nothing on that plan PREVENTED a direct `git push origin main`, or a merge past a red
# `server` job. It detects the bypass after the fact and fails the run, so a violation
# shows up as red on main instead of passing silently.
#
# WHY IT IS STILL HERE
# On 2026-10-09 the owner made the repository PUBLIC, which unlocked protection on the free
# tier: `server` and `mobile` are now REQUIRED on main, strict up-to-date, with force-pushes
# and deletion blocked (roadmap §27AE, checklist §42 — those context names are the CHECK-RUN
# names, not the `ci / server` form the pull-request page displays; configuring the display
# form leaves a green PR blocked on a status that never reports). Protection covers every
# route to main only while it is left switched on: as first applied, `enforce_admins` was false,
# which left the required checks advisory for the ONLY account on this repository — it was set
# true the same day, verified by a refused merge while the checks were pending. This job depends
# on no setting at all and records the pull-request rule in the repository itself, so a relaxed
# setting or a later actor is still visible. It is detection, not prevention — that difference is
# deliberate and documented rather than papered over.
#
# WHAT IT ASSERTS
# Every commit a push to main introduced is associated — by the GitHub API's own PR
# record — with a MERGED pull request. A merge performed through the web UI (merge
# commit, squash or rebase) carries that association; a direct push does not, and
# fails. The rule was verified against real repository data before it shipped:
# `5acaf44` → PR #8, `3e5d2aa` → PR #7, `0c54613` → PR #8, while a non-PR commit
# (`e9616cf`) resolves to none.
#
# WHAT IT DOES NOT DO
# It does not re-check that the required checks were green at merge time: the sibling
# `ci` workflow already runs the full gate on every push to main, so a bad merge is
# independently visible there. This job answers one question only — did this reach
# main through a pull request?
#
# LIMITS RECORDED, NOT HIDDEN
# A push webhook payload is truncated at 20 commits, so a very large push is audited
# from the compare API when that is available and from the payload when it is not; the
# head commit is always checked. This is a compensating control for a paid feature,
# not a replacement for it.
#
# AND ONE THING IT GOT WRONG, NOW FIXED (F-25)
# The commit-to-PR association is *eventually consistent*, and this job's first run with
# real work in it proved that the hard way: on the merge of PR #15 it started six seconds
# after the merge and reported the OLDEST commit of the branch as having no merged pull
# request, while its two siblings resolved to PR #15 in the same run. The identical query
# a minute later resolved all three. A guard that goes red on a legitimate merge is worse
# than no guard — it teaches its reader to ignore the colour — so an empty answer is now
# retried with a backoff before it is called a bypass, and an API that never answers is
# reported as a verification failure instead of an accusation.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  bypass-detector:
    runs-on: ubuntu-latest
    steps:
      # No checkout: every fact comes from the API, and `gh` ships on GitHub-hosted
      # runners.
      - name: Every commit on main arrived through a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PAYLOAD_SHAS: ${{ join(github.event.commits.*.id, ' ') }}
        run: |
          set -euo pipefail

          ZEROES=0000000000000000000000000000000000000000
          shas=""

          # Preferred source: the API's own list of what this push introduced.
          if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "${ZEROES}" ]; then
            shas="$(gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" --jq '.commits[].sha' 2>/dev/null || true)"
          fi

          # Fallbacks: the webhook payload, then the head commit itself.
          if [ -z "${shas}" ]; then shas="${PAYLOAD_SHAS}"; fi
          if [ -z "${shas}" ]; then shas="${AFTER}"; fi

          # The commit-to-PR association is eventually consistent, not immediate: on the
          # merge of PR #15 this job ran six seconds after the merge, called the oldest
          # commit of the branch unassociated while its siblings resolved, and the same
          # query a minute later resolved all three (F-25). An empty answer is therefore
          # retried with a backoff before it is treated as a bypass.
          #   0 = a merged PR was found (KEYS holds its number(s))
          #   1 = the API answered, and there is no merged PR for this commit
          #   2 = the API never answered
          MAX_ATTEMPTS=5
          KEYS=""
          verify_sha() {
            local sha="$1" attempt=1 delay=5 out answer="absent"
            KEYS=""
            while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
              if out="$(gh api "repos/${REPO}/commits/${sha}/pulls" \
                  --jq '[.[] | select(.merged_at != null) | .number] | join(",")' 2>/dev/null)"; then
                if [ -n "${out}" ]; then
                  KEYS="${out}"
                  return 0
                fi
                answer="absent"
              else
                answer="error"
              fi
              if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
                echo "note: no merged pull request for ${sha} on attempt ${attempt}/${MAX_ATTEMPTS}; the association can lag a merge, retrying in ${delay}s" >&2
                sleep "${delay}"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            if [ "${answer}" = "error" ]; then return 2; fi
            return 1
          }

          failed=0
          for sha in ${shas}; do
            status=0
            verify_sha "${sha}" || status=$?
            case "${status}" in
              0)
                echo "OK: ${sha} arrived through PR ${KEYS}"
                ;;
              2)
                echo "::error::could not verify ${sha}: the GitHub API did not answer (${MAX_ATTEMPTS} attempts)"
                failed=1
                ;;
              *)
                echo "::error::commit ${sha} reached main without a merged pull request"
                failed=1
                ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: this push could not be shown to have arrived through the pull-request flow." >&2
            echo "If the line above says the API did not answer, that is a verification failure" >&2
            echo "and not a bypass — re-run this job. If it names a commit, that commit reached" >&2
            echo "main outside a merged pull request: protection either was changed or does not" >&2
            echo "cover the actor. Re-land the work through a pull request. See the header." >&2
            exit 1
          fi

          echo "OK: every commit in this push came from a merged pull request."
